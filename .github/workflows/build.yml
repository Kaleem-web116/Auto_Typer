name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact-name: auto_typer_exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .exe
        run: |
          pyinstaller --onefile --noconsole auto_typer.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto_typer_exe
          path: dist/auto_typer.exe

  release:
    runs-on: windows-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download built executable artifact
        uses: actions/download-artifact@v4
        with:
          name: auto_typer_exe
          path: dist

      - name: Create GitHub Release and upload exe
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: "Download auto_typer.exe below to get started. No Python installation required."
          files: dist/auto_typer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

